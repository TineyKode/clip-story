<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 400px;
      max-height: 500px;
      margin: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    .container {
      padding: 12px;
    }
    h3 {
      margin: 0 0 8px 0;
      font-size: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    button {
      background: #f0f0f0;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
    }
    button:hover {
      background: #e0e0e0;
    }
    #clearAll {
      font-size: 12px;
    }
    #search {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
    }
    #search:focus {
      border-color: #5b6cff;
    }
    #historyList {
      list-style: none;
      padding: 0;
      margin: 12px 0 0 0;
      max-height: 400px;
      overflow-y: auto;
    }
    .history-item {
      background: #f9f9f9;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      margin-bottom: 8px;
      padding: 8px;
      transition: background 0.1s;
      word-break: break-word;
    }
    .history-item:hover {
      background: #eef;
      border-color: #99c;
    }
    .history-text {
      font-size: 13px;
      color: #222;
      cursor: pointer;
    }
    .history-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
    }
    .history-time {
      font-size: 11px;
      color: #999;
    }
    .delete-btn {
      background: transparent;
      border: none;
      color: #aaa;
      font-size: 16px;
      line-height: 1;
      padding: 0 4px;
      cursor: pointer;
    }
    .delete-btn:hover {
      background: transparent;
      color: #e53935;
    }
    .empty-message {
      color: #888;
      text-align: center;
      font-style: italic;
      padding: 20px;
    }
    .footer {
      margin-top: 8px;
      font-size: 11px;
      color: #aaa;
      text-align: center;
    }
    .toast {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #4caf50;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      z-index: 9999;
    }
  </style>
</head>
<body>
<div class="container">
  <h3>
    Clip Story
    <button id="clearAll">Clear all</button>
  </h3>
  <input id="search" type="text" placeholder="Search clippings…" autocomplete="off">
  <ul id="historyList">
    <li class="empty-message">Loading...</li>
  </ul>
  <div class="footer">Click any item to copy it back</div>
</div>
<script src="popup.js"></script>
</body>
</html>
